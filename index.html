
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Mart - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">

      
        <div class="image-section">
            <div class="image-content">
                <h1>Laundry Mart</h1>
                <p>Fresh clothes, fresh beginnings!</p>

                <div class="laundry-image">
                    <img
                        src="https://images.unsplash.com/photo-1517677208171-0bc6725a3e60?w=800"
                        alt="Laundry and washing"
                    >
                </div>

                <h2>We Care For Your Clothes!</h2>
            </div>
        </div>

        
        <div class="form-section">

            <div class="login-form">

                <div class="logo">🧺 Laundry Mart</div>

                <h1>Hello Again!</h1>
                <p class="subtitle">Welcome back! We missed you.</p>

                <form>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>

                    <div class="forgot-password">
                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit">Login</button>

                </form>

                <p class="signup">
                    Don't have an account?
                    <a href="#">Sign Up</a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
